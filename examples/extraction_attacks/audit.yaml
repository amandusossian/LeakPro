audit:  # Configurations for auditing
  random_seed: 1234  # Integer specifying the random seed
  attack_list:
    mastermind:
      # Start of with the common settings and then move on to attack specific stuff
      training_data_fraction: 0.5  # Fraction of the auxilary dataset to use for this attack (in each shadow model training)
      attack_data_fraction: 0.5 # Fraction of auxiliary dataset to sample from during attack
      n_filling_attempts: 100 # Number of attempts to fill the mask 
      global_attack_pool: False
      attack_pool_type: "extended" # using the full pool or another strategy
      attack_pool_size_extension: 5  
      data_pool_path: "../../../text_anonymization_benchmark/echr_test.json"
      target_doc_idx: 10
      attack_strategy: "bandit" # random, bandit
      
      print_res: False
      save_res: False
      plot_res: True
      

      bandit_sampling_alg: "tsallis" # can implment more in the same fashion as this one, like ucb or epsilon greedy for example
      bandit_parameters: 
        tsallis_reward_factor: 1
      
      exact_matching_confidence: False # False if the entity recognition does not care about B- or I-label being exactly right

      gather_context_free_statistics : True # Gathers stats about how the models confidence of the masks without any context
      gather_context_free_statistics_size_extension: 5 # Extend around the mask and bring in other tokens as well. 

      limit_masks: False
      n_mask_limit: 6
      
      single_mask_investigation: False # If True, we will run the attack on a doc and save the results of a single mask as more and more other masks are revealed
      SMI_idx: 0 # The mask id to use for the single mask attack
      
      
      multi_run_averaging: False # If True, we will average the results over multiple runs
    
      MR_n_docs: 1 # Number of runs to average over
      MR_entity_type_id: 2 # The entity type to investigate in the averaging
      MR_correct_fraction: 0.5 # Fraction of other masks to set correct
      MR_sweep_correct_fraction_bool: True
      MR_randomize_doc_idxs: False # If True, we will use random document ids for the multi-run averaging
      MR_doc_id: 10

      expanding_window: False # If True, we will use an expanding window for the attack

      EW_entity_type_id: 0 # The entity type to use for the expanding window attack
      EW_single_entity_bool: True # If True, we investigate a single entity for the expanding window attack
      EW_single_entity_random_mask_bool: True # If True, we will use a random target mask for the expanding window attack instead of the one above
      EW_single_entity_mask_idx: 1 # The target mask id to use for the expanding window
      EW_single_entity_set_rest_correct_bool: False # If True, we will randomize the rest of the masks in the expanding window attack, otherwise they will be set to the correct tokens
      EW_n_increments: 100
      EW_centered_single: True
      EW_centered_single_mask_idx: 4 # The mask id to use for the centered single mask attack
      EW_single_entity_replace_target_bool: False # If True, we will replace the target mask with a random mask and evaluate the performance with.




  output_dir: "./leakpro_output"
  attack_type: "mia" #mia, gia, extract
  modality: "text"

  sm_epochs: 2 # (unused)Number of epochs for training the shadow models
  binary_masking: False #classwise or binary masking
  avg_method: "avg_over_masked" #avg_over_masked or avg_over_all
  class_list: 
    - PERSON
    - CODE
    - LOC
    - ORG
    - DEM
    - DATETIME
    - QUANTITY
    - MISC

target:
  # Target model path
  module_path: "../mia/text_mia/utils/tabds_model_preparation.py"
  model_class: "TABBERT" 
  # Data paths
  target_folder: "./target"
  data_path: "../../../tab_data/tab_train_complete_dataset.pkl"
  datapool_path: "../../../tab_data/tab_train_complete_dataset.pkl"

shadow_model:
  
distillation_model:
